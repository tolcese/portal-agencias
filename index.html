<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Agencias v0.1.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#16202E; --muted:#5A6170; --line:#DCDAD3; --line2:#ECEAE4; --field:#CFCCC3;
  --bg:#F4F3EF; --card:#FFFFFF; --nav:#16202E; --nav2:#2B3B57; --navtxt:#C9CED8;
  --accent:#C2501C; --accent2:#A8431573; --blue:#1F4E8C; --green:#1C5E3A; --wa:#1E7A4A;
  --b-n-bg:#ECEBE6; --b-n:#3D4350; --b-a-bg:#E3ECF8; --b-a:#1F4E8C; --b-r-bg:#FBE7DC; --b-r:#9A3D12;
  --b-ok-bg:#DFF0E6; --b-ok:#1C5E3A; --b-x-bg:#EEEEEE; --b-x:#4A4A4A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--blue)} a:hover{color:#163A69}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7FA6DC;outline-offset:2px}
h1{margin:0;font-size:28px;line-height:36px}
h2{margin:0;font-size:17px;line-height:24px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* layout */
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 220px;max-width:260px;background:var(--nav);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.brand{color:#fff;font-weight:700;font-size:17px;padding:0 12px 20px}
.nav{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;color:var(--navtxt);text-decoration:none;font-size:15px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.nav:hover{color:#fff;background:#24324A}
.nav.on{background:var(--nav2);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:20px 12px 0;border-top:1px solid var(--nav2);color:var(--navtxt);font-size:13px;line-height:18px;display:flex;flex-direction:column;gap:10px}
.side-foot button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;text-align:left;font-size:13px}
.main{flex:999 1 560px;min-width:0;padding:32px 40px;display:flex;flex-direction:column;gap:24px}
.wrap{max-width:1100px;width:100%;display:flex;flex-direction:column;gap:24px}
@media (max-width:760px){
  .side{max-width:none;flex-basis:100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  .brand{padding:0 8px;flex-basis:100%}
  .nav{width:auto}
  .side-foot{margin:0;border:0;padding:0 8px;flex-basis:100%;flex-direction:row;justify-content:space-between}
  .main{padding:20px 16px}
}

/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lbl{font-size:13px;font-weight:600;color:#3D4350}
.f input,.f select,.f textarea{min-height:44px;border:1px solid var(--field);border-radius:8px;padding:0 12px;font-size:15px;background:#fff;width:100%}
.f textarea{padding:10px 12px;min-height:88px;resize:vertical}
.f .help{font-size:13px;line-height:18px;color:var(--muted)}
.f.err input,.f.err select{border-color:#B3261E}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;background:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover:not([disabled]){background:#A84315;color:#fff}
.btn-s{border-color:var(--field);color:var(--ink)}
.btn-s:hover:not([disabled]){background:#F7F6F2}
.btn-wa{border-color:var(--wa);color:var(--wa)}
.btn-wa:hover{background:#EEF7F1;color:var(--wa)}
.btn-link{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.b{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-nueva{background:var(--b-n-bg);color:var(--b-n)}
.b-en_analisis{background:var(--b-a-bg);color:var(--b-a)}
.b-respondida{background:var(--b-r-bg);color:var(--b-r)}
.b-aceptada,.b-aprobado{background:var(--b-ok-bg);color:var(--b-ok)}
.b-desistida,.b-cerrada,.b-rechazado{background:var(--b-x-bg);color:var(--b-x)}
.note{display:flex;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:20px;color:#3D4350}
.alert{padding:12px 14px;border-radius:8px;font-size:14px;line-height:20px;background:#FDECEA;color:#8C1D18;border:1px solid #F3C2BE}
.ok{background:#EAF5EE;color:var(--green);border-color:#BFE0CB}
.kv{display:flex;flex-direction:column;gap:2px}
.kv>span:first-child{font-size:12px;color:var(--muted);font-weight:600}
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.tile span:first-child{font-size:13px;color:var(--muted);font-weight:600}
.tile span:last-child{font-size:30px;font-weight:700;line-height:1.1}

.tbox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.t th{text-align:left;font-size:12px;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.t td{padding:14px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.hl{background:#FFF8F3}
.t tr.click{cursor:pointer}
.t tr.click:hover{background:#FAF9F6}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

.pt{width:100%;border-collapse:collapse;font-size:15px;min-width:380px}
.pt th{text-align:left;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.pt td{padding:10px 12px;border-bottom:1px solid var(--line2)}
.pt tr:last-child td{border-bottom:0}
.pt td.sel{background:#FFF4EC}
.pt label{display:flex;align-items:center;gap:10px;cursor:pointer}
.pt input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.bank{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.bank.pick{border:2px solid var(--accent)}
.bank h3{margin:0;font-size:18px}
.big{font-size:20px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--nav);color:#fff;border-radius:12px;position:sticky;bottom:12px}
.bar .btn-s{background:transparent;color:#fff;border-color:#4A5A75}
.tl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:20px}
.tl li{display:flex;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none}

.drop{min-height:120px;border:2px dashed var(--field);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#3D4350;font-size:14px;cursor:pointer;background:#FAFAF8;text-align:center;padding:12px}
.drop.done{border-color:var(--green);background:#F3FAF6}
.drop input{display:none}

/* auth */
.auth{display:flex;flex-wrap:wrap;min-height:100vh}
.auth-side{flex:1 1 340px;background:var(--nav);color:#fff;padding:56px 48px;display:flex;flex-direction:column;gap:32px}
.auth-side h1{font-size:36px;line-height:44px}
.auth-side p{margin:0;font-size:16px;line-height:26px;color:var(--navtxt)}
.checks{display:flex;flex-direction:column;gap:14px;font-size:15px;color:#E4E7ED}
.checks div{display:flex;gap:12px;align-items:flex-start}
.checks svg{flex:none}
.auth-main{flex:999 1 520px;min-width:0;padding:56px 48px;display:flex;justify-content:center}
.auth-form{width:100%;max-width:640px;display:flex;flex-direction:column;gap:20px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px}
.box{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
@media (max-width:760px){.auth-side,.auth-main{padding:32px 20px}.auth-side h1{font-size:28px;line-height:36px}.box{padding:28px 20px}}

/* toast + modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;z-index:1000;max-width:90vw;box-shadow:0 6px 24px rgba(22,32,46,.25)}
.ov{position:fixed;inset:0;background:rgba(22,32,46,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.modal{background:#fff;border-radius:14px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:16px}
.modal p{margin:0;line-height:22px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #C9CED8;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span>Cargando…</div></div>

<script>
(function(){
'use strict';

// ===================== CONFIG =====================
const APP_VER = '0.1.5';
const VER_KEY = 'portal';
const SUPABASE_URL = 'https://unhirashjnabisxjnebf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_rK8OeIsVb0J68Vf8OUcxRA_d8DSnSSI';
const WHATSAPP_NUM = ''; // ej: '5493511234567' — pendiente de configurar
window.PORTAL_VER = APP_VER;

const PROVINCIAS = ['Buenos Aires','CABA','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego','Tucumán'];
const PLAZOS = [12,18,24,36,48,60];
const ESTADOS = {nueva:'Nueva', en_analisis:'En análisis', respondida:'Respondida', aceptada:'Aceptada', desistida:'Desistida', cerrada:'Cerrada'};

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');

let S = { user:null, agencia:null, bancos:null, consultas:[], channel:null, recovery:false, filtro:{q:'',estado:''} };

// ===================== HELPERS =====================
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const nf = new Intl.NumberFormat('es-AR');
function montoFin(n){ return (n==null||Number(n)===0) ? 'Máximo disponible' : money(n); }
function money(n){ return (n==null||n==='') ? '—' : '$ ' + nf.format(Math.round(Number(n))); }
function parseMoneda(s){
  if (s==null) return null;
  let t = String(s).replace(/[^\d,.-]/g,'').trim();
  if (!t) return null;
  t = t.replace(/\./g,'').replace(',', '.');
  const n = Number(t);
  return isFinite(n) ? n : null;
}
function fmtMonedaInput(el){ const n = parseMoneda(el.value); el.value = n==null ? '' : '$ ' + nf.format(n); }
function fmtD(d, conHora){
  if (!d) return '—';
  const x = new Date(d);
  const dd = String(x.getDate()).padStart(2,'0'), mm = String(x.getMonth()+1).padStart(2,'0');
  let s = dd + '/' + mm;
  if (conHora) s += ' ' + String(x.getHours()).padStart(2,'0') + ':' + String(x.getMinutes()).padStart(2,'0');
  return s;
}
function fmtFecha(d){ if(!d) return '—'; const p = String(d).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function soloDigitos(s){ return String(s||'').replace(/\D/g,''); }
function fmtCuit(s){ const d = soloDigitos(s); return d.length===11 ? d.slice(0,2)+'-'+d.slice(2,10)+'-'+d.slice(10) : s; }
function fmtDni(s){ const d = soloDigitos(s); return d ? nf.format(Number(d)) : ''; }
function nro(id){ return String(id).padStart(4,'0'); }
function badge(e){ return '<span class="b b-'+esc(e)+'">'+esc(ESTADOS[e]||e)+'</span>'; }
const $ = (sel, root) => (root||document).querySelector(sel);
const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));

let toastT;
function toast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id='toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.add('hidden'), 4000);
}
function confirmar(texto, okTxt, cancelTxt){
  return new Promise(res=>{
    const ov = document.createElement('div'); ov.className='ov';
    ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><p>'+esc(texto)+'</p><div class="row" style="justify-content:flex-end"><button class="btn btn-s" data-r="0">'+esc(cancelTxt||'Cancelar')+'</button><button class="btn btn-p" data-r="1">'+esc(okTxt||'Confirmar')+'</button></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', e=>{
      const r = e.target.getAttribute && e.target.getAttribute('data-r');
      if (r!==null || e.target===ov){ ov.remove(); res(r==='1'); }
    });
    $('[data-r="1"]', ov).focus();
  });
}
function errMsg(e){
  const m = (e && (e.message||e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'Email o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Todavía no confirmaste tu email. Revisá tu bandeja de entrada (y spam).';
  if (/already registered|already been registered/i.test(m)) return 'Ya existe una cuenta con ese email.';
  if (/Database error saving new user/i.test(m)) return 'Ya existe una agencia registrada con ese CUIT.';
  if (/Password should be at least/i.test(m)) return 'La contraseña debe tener al menos 8 caracteres.';
  if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Esperá unos minutos y probá de nuevo.';
  return m;
}
function busy(btn, on, txt){
  if (!btn) return;
  if (on){ btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + (txt||''); }
  else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
}
const ICON_CHECK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F08A5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_INFO = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F4E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>';
const ICON_WA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"/></svg>';
const ICON_PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

// ===================== AUTO-ACTUALIZACIÓN =====================
async function recargarFresco(){
  try { await fetch(location.href.split('#')[0], { cache:'reload' }); } catch(e){}
  location.reload();
}
function bannerUpdate(nueva){
  if (document.getElementById('updBar')) return;
  const d = document.createElement('div');
  d.id = 'updBar';
  d.setAttribute('role','status');
  d.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:1001;background:#16202E;color:#fff;padding:12px 14px 12px 18px;border-radius:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 28px rgba(22,32,46,.3);max-width:92vw;font-size:14px';
  d.innerHTML = '<span>Hay una versión nueva (v'+esc(nueva)+')</span><button type="button" style="min-height:36px;padding:0 14px;border:0;border-radius:8px;background:#C2501C;color:#fff;font-weight:600;cursor:pointer">Actualizar</button>';
  d.querySelector('button').onclick = recargarFresco;
  document.body.appendChild(d);
}
async function chequearVersion(inicio){
  try{
    const r = await fetch('version.json?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) return;
    const v = await r.json();
    const nueva = v[VER_KEY];
    if (!nueva || nueva === APP_VER) return;
    const marca = 'upd_' + VER_KEY + '_' + nueva;
    let yaIntento = false;
    try { yaIntento = sessionStorage.getItem(marca) === '1'; } catch(e){}
    if (inicio && !yaIntento){
      try { sessionStorage.setItem(marca, '1'); } catch(e){}
      return recargarFresco();
    }
    bannerUpdate(nueva);
  } catch(e){}
}
chequearVersion(true);
setInterval(()=>chequearVersion(false), 3*60*1000);
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible') chequearVersion(false); });

// ===================== ROUTER =====================
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener('hashchange', route);

async function route(){
  const h = location.hash || '';
  if (S.recovery) return viewNuevaClave();
  if (!S.user){
    if (h === '#registro') return viewRegistro();
    if (h === '#olvide') return viewOlvide();
    return viewLogin();
  }
  if (!S.agencia) return viewNoAgencia();
  if (S.agencia.estado !== 'aprobada') return viewRevision();
  if (h === '#nueva') return viewNueva();
  if (h.indexOf('#consulta/') === 0) return viewDetalle(Number(h.split('/')[1]));
  if (h === '#agencia') return viewAgencia();
  return viewPanel();
}

// ===================== SESSION =====================
async function cargarAgencia(){
  const { data, error } = await sb.from('agencias').select('*').eq('id', S.user.id).maybeSingle();
  if (error) throw error;
  S.agencia = data;
}
async function iniciar(session){
  S.user = session ? session.user : null;
  S.agencia = null; S.bancos = null; S.consultas = [];
  if (S.channel){ sb.removeChannel(S.channel); S.channel = null; }
  if (S.user){
    try { await cargarAgencia(); } catch(e){ toast(errMsg(e)); }
    if (S.agencia && S.agencia.estado === 'aprobada') suscribir();
  }
  route();
}
function suscribir(){
  S.channel = sb.channel('consultas-agencia')
    .on('postgres_changes', { event:'*', schema:'public', table:'consultas', filter:'agencia_id=eq.'+S.user.id }, payload=>{
      const h = location.hash || '';
      const id = payload.new && payload.new.id;
      if (h === '' || h === '#panel') viewPanel(true);
      else if (id && h === '#consulta/'+id) viewDetalle(id, true);
    })
    .subscribe();
}
async function salir(){ await sb.auth.signOut(); location.hash = ''; }

sb.auth.onAuthStateChange((ev, session)=>{
  if (ev === 'PASSWORD_RECOVERY'){ S.recovery = true; S.user = session && session.user; return route(); }
  if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT'){
    if ((S.user && session && S.user.id === session.user.id) && ev === 'SIGNED_IN') return;
    iniciar(session);
  }
});
sb.auth.getSession().then(({data})=> iniciar(data.session));

// ===================== AUTH VIEWS =====================
function authSide(){
  return '<aside class="auth-side"><div style="font-size:18px;font-weight:700">Portal Agencias</div>'
    + '<div style="display:flex;flex-direction:column;gap:16px"><h1>Simulá créditos prendarios para tus clientes sin moverte de la agencia</h1>'
    + '<p>Cargás la consulta, se simula en los bancos y te devolvemos respuestas confirmadas.</p></div>'
    + '<div class="checks"><div>'+ICON_CHECK+'<span>Una sola carga, varios bancos</span></div><div>'+ICON_CHECK+'<span>Seguís el estado de cada consulta en tiempo real</span></div></div></aside>';
}

function viewLogin(msg){
  app.innerHTML = '<div class="auth">'+authSide()+'<main class="auth-main"><form class="auth-form" id="fLogin" novalidate style="max-width:440px">'
   + '<div><h2 style="font-size:28px;line-height:36px">Ingresar</h2><p class="muted" style="margin:6px 0 0">Accedé con el email y la contraseña de tu agencia.</p></div>'
   + (msg ? '<div class="alert ok">'+esc(msg)+'</div>' : '')
   + '<div id="err" class="alert hidden"></div>'
   + '<div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>'
   + '<div class="f"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required></div>'
   + '<button class="btn btn-p" type="submit">Ingresar</button>'
   + '<div class="row between"><button type="button" class="btn-link" id="aOlv">¿Olvidaste tu contraseña?</button><span class="muted" style="font-size:14px">¿No tenés cuenta? <a href="#registro">Solicitá el alta</a></span></div>'
   + '</form></main></div>';
  $('#aOlv').onclick = ()=>go('#olvide');
  $('#fLogin').onsubmit = async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'), er = $('#err');
    er.classList.add('hidden');
    const email = $('#em').value.trim(), password = $('#pw').value;
    if (!email || !password){ er.textContent='Completá email y contraseña.'; er.classList.remove('hidden'); return; }
    busy(btn, true, 'Ingresando…');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    busy(btn, false);
    if (error){ er.textContent = errMsg(error); er.classList.remove('hidden'); }
  };
}

function viewOlvide(){
  app.innerHTML = '<div class="center"><form class="box" id="fOlv" novalidate style="text-align:left;align-items:stretch">'
   + '<h2 style="font-size:24px;line-height:32px">Recuperar contraseña</h2><p class="muted" style="margin:0">Te enviamos un link para elegir una contraseña nueva.</p>'
   + '<div id="err" class="alert hidden"></div>'
   + '<div class="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>'
   + '<button class="btn btn-p" type="submit">Enviar link</button><a href="#" style="font-size:14px">Volver a ingresar</a></form></div>';
  $('#fOlv').onsubmit = async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button'), er = $('#err'), email = $('#em').value.trim();
    if (!email){ er.textContent='Ingresá tu email.'; er.classList.remove('hidden'); return; }
    busy(btn, true, 'Enviando…');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    busy(btn, false);
    if (error){ er.textContent = errMsg(error); er.classList.remove('hidden'); return; }
    location.hash=''; viewLogin('Si el email está registrado, te llegó un link para cambiar la contraseña.');
  };
}

function viewNuevaClave(){
  app.innerHTML = '<div class="center"><form class="box" id="fNc" novalidate style="text-align:left;align-items:stretch">'
   + '<h2 style="font-size:24px;line-height:32px">Elegí tu nueva contraseña</h2><div id="err" class="alert hidden"></div>'
   + '<div class="f"><label for="p1">Contraseña nueva</label><input id="p1" type="password" autocomplete="new-password"><span class="help">Mínimo 8 caracteres.</span></div>'
   + '<div class="f"><label for="p2">Repetir contraseña</label><input id="p2" type="password" autocomplete="new-password"></div>'
   + '<button class="btn btn-p" type="submit">Guardar contraseña</button></form></div>';
  $('#fNc').onsubmit = async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button'), er = $('#err'), p1=$('#p1').value, p2=$('#p2').value;
    er.classList.add('hidden');
    if (p1.length < 8){ er.textContent='La contraseña debe tener al menos 8 caracteres.'; er.classList.remove('hidden'); return; }
    if (p1 !== p2){ er.textContent='Las contraseñas no coinciden.'; er.classList.remove('hidden'); return; }
    busy(btn, true, 'Guardando…');
    const { error } = await sb.auth.updateUser({ password:p1 });
    busy(btn, false);
    if (error){ er.textContent = errMsg(error); er.classList.remove('hidden'); return; }
    S.recovery = false; toast('Contraseña guardada.');
    const { data } = await sb.auth.getSession(); location.hash=''; iniciar(data.session);
  };
}

   + '<div class="f"><label for="resp">Nombre del responsable</label><input id="resp" autocomplete="name"></div>'
   + '<div class="f"><label for="tel">Teléfono / WhatsApp</label><input id="tel" type="tel" autocomplete="tel" placeholder="351 555-1234"></div>'
   + '<div class="f"><label for="loc">Localidad</label><input id="loc"></div>'
   + '<div class="f"><label for="prov">Provincia</label><select id="prov">'+provs+'</select></div>'
   + '</div><div style="height:1px;background:var(--line)"></div>'
   + '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'
   + '<div class="f" style="grid-column:1/-1"><label for="em">Email (será tu usuario)</label><input id="em" type="email" autocomplete="email"></div>'
   + '<div class="f"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="new-password"><span class="help">Mínimo 8 caracteres.</span></div>'
   + '<div class="f"><label for="pw2">Repetir contraseña</label><input id="pw2" type="password" autocomplete="new-password"></div>'
   + '</div>'
   + '<label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px;color:#3D4350"><input id="tyc" type="checkbox" style="width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent)"><span>Acepto los términos de uso y la política de tratamiento de datos personales</span></label>'
   + '<button class="btn btn-p" type="submit" style="min-height:48px;font-size:16px">Solicitar alta</button>'
   + '<div class="note">'+ICON_INFO+'<span>Tu cuenta queda pendiente hasta que la aprobemos. Te avisamos por mail cuando esté habilitada.</span></div>'
   + '<p class="muted" style="margin:0;font-size:14px">¿Ya tenés cuenta? <a href="#">Ingresá</a></p>'
   + '</form></main></div>';
  $('#fReg').onsubmit = async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'), er = $('#err');
    er.classList.add('hidden'); $$('.f.err').forEach(x=>x.classList.remove('err'));
    const v = id=>$('#'+id).value.trim();
    const faltan = ['rs','cuit','resp','tel','loc','em','pw','pw2'].filter(id=>!v(id));
    const fail = (m, ids)=>{ er.textContent=m; er.classList.remove('hidden'); (ids||[]).forEach(id=>$('#'+id).closest('.f').classList.add('err')); er.scrollIntoView({block:'center'}); };
    if (faltan.length) return fail('Completá todos los campos marcados.', faltan);
    const cuit = soloDigitos(v('cuit'));
    if (cuit.length !== 11) return fail('El CUIT tiene que tener 11 números.', ['cuit']);
    if ($('#pw').value.length < 8) return fail('La contraseña debe tener al menos 8 caracteres.', ['pw']);

    busy(btn, false);
    if (error) return fail(errMsg(error));
    if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return fail('Ya existe una cuenta con ese email.', ['em']);
    if (!data.session){
      app.innerHTML = '<div class="center"><div class="box">'
        + '<div style="width:64px;height:64px;border-radius:50%;background:#E3ECF8;display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F4E8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>'

// ===================== SHELL =====================
function shell(activo, contenido){
  const a = S.agencia;
  const item = (h, t)=>'<a class="nav'+(activo===h?' on':'')+'" href="'+h+'">'+t+'</a>';
  return '<div class="shell"><nav class="side" aria-label="Menú"><div class="brand">Portal Agencias</div>'
    + item('#panel','Mis consultas') + item('#nueva','Nueva consulta') + item('#agencia','Mi agencia')
    + '<div class="side-foot"><span>'+esc(a.responsable)+'<br>'+esc(a.razon_social)+'</span><button id="bOut">Cerrar sesión</button></div></nav>'
    + '<main class="main"><div class="wrap">'+contenido+'</div></main></div>';
}
function bindShell(){ const b = $('#bOut'); if (b) b.onclick = salir; }
function abrirWhatsApp(){
  if (!WHATSAPP_NUM){ toast('El número de WhatsApp todavía no está configurado.'); return; }
  const a = S.agencia;
  const msg = 'Hola, soy '+a.responsable+' de '+a.razon_social+'. Tengo una consulta: ';
  window.open('https://wa.me/'+WHATSAPP_NUM+'?text='+encodeURIComponent(msg), '_blank', 'noopener');
}
async function getBancos(){
  if (S.bancos) return S.bancos;
  const { data, error } = await sb.from('bancos').select('*').eq('activo', true).order('orden');
  if (error) throw error;
  const prov = S.agencia.provincia;
  S.bancos = (data||[]).filter(b=>!b.provincias || b.provincias.indexOf(prov) >= 0);
  return S.bancos;
}

// ===================== PANEL =====================
async function viewPanel(silencioso){
  if (!silencioso) app.innerHTML = shell('#panel', '<div class="loading" style="min-height:40vh"><span class="spin"></span>Cargando consultas…</div>');
  const { data, error } = await sb.from('consultas')
    .select('id,cliente_nombre,cliente_dni,vehiculo_marca,vehiculo_modelo,vehiculo_anio,vehiculo_condicion,monto_a_financiar,estado,created_at')
    .order('created_at', { ascending:false }).limit(500);
  if (error){ toast(errMsg(error)); return; }
  S.consultas = data || [];
  const c = S.consultas;
  const ahora = new Date(), mes = ahora.getMonth(), anio = ahora.getFullYear();
  const enAnalisis = c.filter(x=>x.estado==='nueva'||x.estado==='en_analisis').length;
  const conResp = c.filter(x=>x.estado==='respondida').length;
  const delMes = c.filter(x=>{ const d=new Date(x.created_at); return d.getMonth()===mes && d.getFullYear()===anio; }).length;
  const estOpts = '<option value="">Todos los estados</option>' + Object.keys(ESTADOS).map(k=>'<option value="'+k+'"'+(S.filtro.estado===k?' selected':'')+'>'+ESTADOS[k]+'</option>').join('');
  const html = '<div class="row between" style="gap:16px"><div><h1>Mis consultas</h1><p class="muted" style="margin:4px 0 0">'+esc(S.agencia.razon_social)+(S.agencia.localidad?', '+esc(S.agencia.localidad):'')+'</p></div>'
    + '<div class="row"><button class="btn btn-wa" id="bWa">'+ICON_WA+'Consulta por WhatsApp</button><a class="btn btn-p" href="#nueva">'+ICON_PLUS+'Nueva consulta</a></div></div>'
    + '<div class="tiles"><div class="tile"><span>En análisis</span><span style="color:var(--blue)">'+enAnalisis+'</span></div>'
    + '<div class="tile"><span>Con respuesta</span><span style="color:var(--b-r)">'+conResp+'</span></div>'
    + '<div class="tile"><span>Cargadas este mes</span><span>'+delMes+'</span></div></div>'
    + '<div class="row"><input id="q" aria-label="Buscar" placeholder="Buscar por cliente o DNI" value="'+esc(S.filtro.q)+'" style="flex:1 1 260px;height:44px;border:1px solid var(--field);border-radius:8px;padding:0 12px;background:#fff">'
    + '<select id="fe" aria-label="Estado" style="height:44px;border:1px solid var(--field);border-radius:8px;padding:0 12px;background:#fff">'+estOpts+'</select></div>'
    + '<div id="lista"></div>';
  app.innerHTML = shell('#panel', html); bindShell();
  $('#bWa').onclick = abrirWhatsApp;
  $('#q').oninput = e=>{ S.filtro.q = e.target.value; pintarLista(); };
  $('#fe').onchange = e=>{ S.filtro.estado = e.target.value; pintarLista(); };
  pintarLista();
}
function pintarLista(){
  const q = S.filtro.q.trim().toLowerCase(), qd = soloDigitos(q);
  const rows = S.consultas.filter(x=>{
    if (S.filtro.estado && x.estado !== S.filtro.estado) return false;
    if (!q) return true;
    return (x.cliente_nombre||'').toLowerCase().indexOf(q) >= 0 || (qd && soloDigitos(x.cliente_dni).indexOf(qd) >= 0);
  });
  const box = $('#lista'); if (!box) return;
  if (!S.consultas.length){
    box.innerHTML = '<div class="tbox"><div class="empty"><b style="color:var(--ink);font-size:16px">Todavía no cargaste consultas</b><span>Cargá la primera y seguí su estado desde acá.</span><a class="btn btn-p" href="#nueva">'+ICON_PLUS+'Nueva consulta</a></div></div>';
    return;
  }
  if (!rows.length){ box.innerHTML = '<div class="tbox"><div class="empty">Ninguna consulta coincide con la búsqueda.</div></div>'; return; }
  box.innerHTML = '<div class="tbox"><table class="t"><thead><tr><th>N°</th><th>Cliente</th><th>Vehículo</th><th>Monto</th><th>Cargada</th><th>Estado</th><th></th></tr></thead><tbody>'
    + rows.map(x=>{
        const veh = [x.vehiculo_marca, x.vehiculo_modelo, x.vehiculo_condicion==='0km' ? '0km' : x.vehiculo_anio].filter(Boolean).join(' ');
        return '<tr class="click'+(x.estado==='respondida'?' hl':'')+'" data-id="'+x.id+'"><td>'+nro(x.id)+'</td>'
          + '<td><b>'+esc(x.cliente_nombre)+'</b><br><span class="muted">DNI '+esc(fmtDni(x.cliente_dni))+'</span></td>'
          + '<td>'+esc(veh||'—')+'</td><td>'+montoFin(x.monto_a_financiar)+'</td><td>'+fmtD(x.created_at)+'</td>'
          + '<td>'+badge(x.estado)+'</td><td><a href="#consulta/'+x.id+'">Ver</a></td></tr>';
      }).join('')
    + '</tbody></table></div>';
  $$('tr.click', box).forEach(tr=> tr.onclick = e=>{ if (e.target.tagName !== 'A') go('#consulta/'+tr.dataset.id); });
}

  $$('.money').forEach(el=> el.addEventListener('blur', ()=>fmtMonedaInput(el)));
  const docBox = $('#docBox');
  const bancoSel = ()=> bancos.find(b=>String(b.id)===$('#banco').value);
  const conDni = bancos.filter(x=>x.requiere_dni);
  const nombresDni = conDni.map(x=>x.nombre).join(' y ');
  const actDoc = ()=>{
    const b = bancoSel();
    const ver = b ? !!b.requiere_dni : conDni.length > 0;
    docBox.classList.toggle('hidden', !ver);
    const av = $('#docAviso');
    if (b && b.requiere_dni) av.textContent = 'Obligatorio para simular en Banco ' + b.nombre + ': cargá frente y dorso del DNI.';
    else if (!b && conDni.length) av.textContent = 'Para que también se simule en ' + nombresDni + ', cargá el DNI frente y dorso. Si no las cargás, ' + nombresDni + ' queda afuera.';
  };
  $('#banco').onchange = actDoc; actDoc();
  [['fF','dF'],['fD','dD']].forEach(([i,d])=>{
    $('#'+i).onchange = e=>{
      const f = e.target.files[0], box = $('#'+d), t = $('[data-t]', box);
      if (!f){ box.classList.remove('done'); t.textContent='Tocá para subir una foto'; return; }
      if (f.size > 5*1024*1024){ toast('El archivo supera 5 MB. Probá con una foto más liviana.'); e.target.value=''; return; }
      box.classList.add('done'); t.textContent = f.name + ' · listo';
    };
  });

  $('#fN').onsubmit = async e=>{
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'), er = $('#err');
    er.classList.add('hidden'); $$('.f.err').forEach(x=>x.classList.remove('err'));
    const fail = (m, ids)=>{ er.textContent=m; er.classList.remove('hidden'); (ids||[]).forEach(id=>{ const n=$('#'+id); n && n.closest('.f') && n.closest('.f').classList.add('err'); }); er.scrollIntoView({block:'center'}); };
    const v = id=>$('#'+id).value.trim();
    const dni = soloDigitos(v('dni'));
    const falt = [], msgs = [];
    if (dni.length < 7 || dni.length > 8){ falt.push('dni'); msgs.push('el DNI tiene que tener 7 u 8 números'); }
    if (!v('nom')){ falt.push('nom'); msgs.push('falta el nombre y apellido'); }
    let monto = parseMoneda(v('monto'));
    if (monto !== null && monto < 0){ falt.push('monto'); msgs.push('el monto no puede ser negativo'); }
    if (!monto) monto = null;
    if (falt.length){ const m = msgs.join('; '); return fail(m.charAt(0).toUpperCase() + m.slice(1) + '.', falt); }
    const anio = v('anio') ? Number(v('anio')) : null;
    if (anio && (anio < 1980 || anio > anioAct + 1)) return fail('El año del vehículo no es válido.', ['anio']);
    const cuil = soloDigitos(v('cuil'));
    if (cuil && cuil.length !== 11) return fail('El CUIL / CUIT tiene que tener 11 números.', ['cuil']);
    const b = bancoSel(), reqDni = b && b.requiere_dni;
    const fF = $('#fF').files[0], fD = $('#fD').files[0];
    if (reqDni && (!fF || !fD)) return fail('Para '+b.nombre+' hay que adjuntar frente y dorso del DNI.');
    if ((fF && !fD) || (!fF && fD)) return fail('Falta '+(fF?'el dorso':'el frente')+' del DNI. Cargá las dos fotos o ninguna.');
    if (!$('#cons').checked) return fail('Falta confirmar que el cliente autorizó la consulta.');
    const subirDni = !!(fF && fD) && (!b || reqDni);
    if (!b && conDni.length && !subirDni){
      const ok = await confirmar('No cargaste las fotos del DNI. Sin ellas no se puede simular en ' + nombresDni + '. ¿Enviar igual?', 'Enviar sin DNI', 'Volver y cargarlas');
      if (!ok){ docBox.scrollIntoView({ block:'center', behavior:'smooth' }); return; }
    }

    busy(btn, true, 'Enviando…');
    try{
      let pF = null, pD = null;
      if (subirDni){
        const sube = async (f, lado)=>{
          const ext = (f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
          const path = S.user.id + '/' + Date.now() + '_' + dni + '_' + lado + '.' + ext;
          const { error } = await sb.storage.from('dni').upload(path, f, { contentType: f.type || undefined, upsert:false });
          if (error) throw error;
          return path;
        };
        pF = await sube(fF, 'frente'); pD = await sube(fD, 'dorso');
      }
      const reg = {
        agencia_id: S.user.id,
        cliente_dni: dni, cliente_cuit: cuil || null, cliente_nombre: v('nom'),
        vehiculo_marca: v('marca') || null, vehiculo_modelo: v('mod') || null, vehiculo_anio: anio,
        vehiculo_condicion: $('#cond').value, valor_vehiculo: parseMoneda(v('valor')),
        monto_a_financiar: monto,
        plazo_deseado: v('plazo') ? Number(v('plazo')) : null,
        banco_id: b ? b.id : null,
        dni_frente_path: pF, dni_dorso_path: pD,
        observaciones: v('obs') || null,
        consentimiento_datos: true
      };
      const { data, error } = await sb.from('consultas').insert(reg).select('id').single();
      if (error) throw error;
      toast('Consulta N° '+nro(data.id)+' enviada.');
      go('#consulta/'+data.id);
    } catch(err){
      busy(btn, false); fail(errMsg(err));
    }
  };
}

// ===================== DETALLE =====================
async function viewDetalle(id, silencioso){
  if (!silencioso){ app.innerHTML = shell('#panel', '<div class="loading" style="min-height:40vh"><span class="spin"></span>Cargando consulta…</div>'); bindShell(); }
  const [rc, ro] = await Promise.all([
    sb.from('consultas').select('*, banco:bancos(nombre)').eq('id', id).maybeSingle(),
    sb.from('ofertas').select('id,resultado,monto_aprobado,monto_neto,vigencia_hasta,requisitos,banco_id,banco:bancos(nombre,admite_uva,orden),cuotas:oferta_cuotas(id,plazo_meses,tipo_tasa,cuota)').eq('consulta_id', id)
  ]);
  if (rc.error){ toast(errMsg(rc.error)); return; }
  const c = rc.data;
  if (!c){ app.innerHTML = shell('#panel', '<div class="card"><h2>No encontramos esa consulta</h2><a href="#panel">Volver a mis consultas</a></div>'); bindShell(); return; }
  const ofertas = (ro.data || []).sort((a,b)=>{
    if (a.resultado !== b.resultado) return a.resultado === 'aprobado' ? -1 : 1;
    return ((a.banco&&a.banco.orden)||0) - ((b.banco&&b.banco.orden)||0);
  });

  const veh = [c.vehiculo_marca, c.vehiculo_modelo, c.vehiculo_condicion==='0km' ? '0km' : c.vehiculo_anio].filter(Boolean).join(' ') || '—';
  const kv = (k, val)=>'<div class="kv"><span>'+k+'</span><span>'+val+'</span></div>';
  const resumen = '<section class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px">'
    + kv('DNI', esc(fmtDni(c.cliente_dni))) + kv('Vehículo', esc(veh)) + kv('Monto pedido', montoFin(c.monto_a_financiar))
    + kv('Plazo deseado', c.plazo_deseado ? c.plazo_deseado+' meses' : 'Indistinto')
    + kv('Banco', c.banco ? esc(c.banco.nombre) : 'Todos') + kv('Cargada', fmtD(c.created_at,true)) + '</section>';

  // Seguimiento
  const pasos = [];
  if (c.estado==='aceptada') pasos.push(['Aceptada', fmtD(c.updated_at,true), 'var(--green)']);
  if (c.estado==='desistida') pasos.push(['Desistida', fmtD(c.updated_at,true), '#8A8F99']);
  if (c.respondida_at) pasos.push(['Respondida', fmtD(c.respondida_at,true)+(ofertas.length?' · '+ofertas.length+(ofertas.length===1?' banco':' bancos'):''), 'var(--b-r)']);
  if (c.tomada_at) pasos.push(['En análisis', fmtD(c.tomada_at,true), 'var(--blue)']);
  pasos.push(['Nueva', fmtD(c.created_at,true)+' · cargada por vos', '#8A8F99']);
  const seguimiento = '<aside class="card" style="flex:1 1 260px;align-self:flex-start"><h2>Seguimiento</h2><ol class="tl">'
    + pasos.map(p=>'<li><span class="dot" style="background:'+p[2]+'"></span><span><b>'+p[0]+'</b><br><span class="muted">'+esc(p[1])+'</span></span></li>').join('') + '</ol></aside>';

  // Respuestas
  let cuerpo = '';
  const puedeElegir = c.estado === 'respondida';
  const puedeDesistir = ['nueva','en_analisis','respondida'].indexOf(c.estado) >= 0;
  if (c.estado === 'nueva' || c.estado === 'en_analisis'){
    cuerpo = '<div class="card"><h2>'+(c.estado==='nueva'?'Consulta recibida':'Estamos simulando en los bancos')+'</h2>'
      + '<p class="muted" style="margin:0">Cuando tengamos las respuestas las vas a ver acá, con todos los plazos y cuotas disponibles. Esta pantalla se actualiza sola.</p></div>';
  } else if (!ofertas.length){
    cuerpo = '<div class="card"><p class="muted" style="margin:0">Esta consulta no tiene respuestas cargadas.</p></div>';
  } else {
    let aceptadaTxt = '';
    cuerpo = ofertas.map(o=>{
      const nombre = o.banco ? o.banco.nombre : 'Banco';
      if (o.resultado === 'rechazado'){
        return '<article class="bank" style="flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center"><h3>Banco '+esc(nombre)+'</h3><span class="b b-rechazado">Rechazado</span></article>';
      }
      const cu = o.cuotas || [];
      const plazos = Array.from(new Set(cu.map(x=>x.plazo_meses))).sort((a,b)=>a-b);
      const hayF = cu.some(x=>x.tipo_tasa==='fija'), hayU = cu.some(x=>x.tipo_tasa==='uva');
      const tipos = []; if (hayF) tipos.push('fija'); if (hayU) tipos.push('uva');
      const tasaTxt = hayF && hayU ? 'Fija y UVA' : (hayU ? 'Solo UVA' : 'Solo fija');
      const tieneAcept = cu.some(x=>x.id===c.cuota_aceptada_id);
      const celda = (p, t)=>{
        const q = cu.find(x=>x.plazo_meses===p && x.tipo_tasa===t);
        if (!q) return '<td class="muted">—</td>';
        const sel = q.id === c.cuota_aceptada_id;
        if (sel) aceptadaTxt = 'Banco '+nombre+' · '+p+' cuotas · '+(t==='uva'?'UVA (cuota inicial)':'Tasa fija')+' · '+money(q.cuota);
        const lbl = 'Banco '+nombre+', '+p+' cuotas, '+(t==='uva'?'UVA':'tasa fija')+', '+money(q.cuota);
        return '<td'+(sel?' class="sel"':'')+'><label><input type="radio" name="op" value="'+q.id+'" data-desc="'+esc(lbl)+'" aria-label="'+esc(lbl)+'"'+(sel?' checked':'')+(puedeElegir?'':' disabled')+'><span>'+money(q.cuota)+'</span></label></td>';
      };
      return '<article class="bank'+(tieneAcept?' pick':'')+'"><div class="row between"><h3>Banco '+esc(nombre)+'</h3><span class="b b-aprobado">Aprobado</span></div>'
        + '<div class="row" style="gap:32px"><div class="kv"><span>Le queda al cliente</span><span class="big" style="color:var(--green)">'+money(o.monto_neto!=null?o.monto_neto:o.monto_aprobado)+'</span></div>'
        + '<div class="kv"><span>Monto aprobado por el banco</span><span class="big">'+money(o.monto_aprobado)+'</span></div>'
        + (o.vigencia_hasta ? '<div class="kv"><span>Vigente hasta</span><span class="big">'+fmtFecha(o.vigencia_hasta).slice(0,5)+'</span></div>' : '')
        + '<div class="kv"><span>Tasa</span><span class="big">'+tasaTxt+'</span></div></div>'
        + (plazos.length ? '<div style="border:1px solid var(--line2);border-radius:10px;overflow-x:auto"><table class="pt"><thead><tr><th>Plazo</th>'+tipos.map(t=>'<th>'+(t==='uva'?'UVA · cuota inicial':'Tasa fija')+'</th>').join('')+'</tr></thead><tbody>'
            + plazos.map(p=>'<tr><td><b>'+p+' cuotas</b></td>'+tipos.map(t=>celda(p,t)).join('')+'</tr>').join('') + '</tbody></table></div>' : '')
        + (o.requisitos ? '<p style="margin:0;padding:12px 14px;background:var(--bg);border-radius:8px;font-size:14px;line-height:20px;color:#3D4350"><b>Requisitos:</b> '+esc(o.requisitos)+'</p>' : '')
        + '</article>';
    }).join('');
    const hayUva = ofertas.some(o=>(o.cuotas||[]).some(x=>x.tipo_tasa==='uva'));
    cuerpo = '<div><h2 style="font-size:19px">Respuestas de los bancos</h2><p class="muted" style="margin:4px 0 0;font-size:14px">'
      + (puedeElegir ? 'Elegí banco, plazo y tipo de tasa.' : '') + (hayUva ? ' En UVA se muestra la cuota inicial, que después se ajusta por inflación.' : '') + '</p></div>'
      + cuerpo;
    if (c.estado === 'aceptada' && aceptadaTxt){
      cuerpo += '<div class="alert ok"><b>Opción aceptada:</b> '+esc(aceptadaTxt)+'. Nos ponemos en contacto para avanzar.</div>';
    }
  }
  let barra = '';
  if (puedeElegir && ofertas.some(o=>o.resultado==='aprobado')){
    barra = '<div class="bar"><span id="selTxt">Elegí una opción de la tabla</span><div class="row" style="gap:10px"><button class="btn btn-s" id="bDes">El cliente desiste</button><button class="btn btn-p" id="bAcep" disabled>Aceptar opción</button></div></div>';
  } else if (puedeDesistir){
    barra = '<div class="row"><button class="btn btn-s" id="bDes">El cliente desiste</button></div>';
  }

  const html = '<div><a href="#panel" style="font-size:14px;text-decoration:none">← Mis consultas</a><div class="row"><h1>Consulta N° '+nro(c.id)+' · '+esc(c.cliente_nombre)+'</h1>'+badge(c.estado)+'</div></div>'
    + resumen
    + '<div class="row" style="align-items:flex-start;gap:24px"><section style="flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:16px">'+cuerpo+barra+'</section>'+seguimiento+'</div>';
  app.innerHTML = shell('#panel', html); bindShell();

  $$('input[name=op]').forEach(r=> r.onchange = ()=>{
    $$('.pt td.sel').forEach(td=>td.classList.remove('sel'));
    r.closest('td').classList.add('sel');
    $$('.bank.pick').forEach(b=>b.classList.remove('pick'));
    r.closest('.bank').classList.add('pick');
    $('#selTxt').innerHTML = 'Seleccionado: <b>'+esc(r.dataset.desc)+'</b>';
    $('#bAcep').disabled = false;
  });
  const bA = $('#bAcep');
  if (bA) bA.onclick = async ()=>{
    const r = $('input[name=op]:checked'); if (!r) return;
    if (!await confirmar('¿Confirmás esta opción? '+r.dataset.desc, 'Aceptar opción')) return;
    busy(bA, true);
    const { error } = await sb.rpc('agencia_aceptar_opcion', { p_consulta:c.id, p_cuota:Number(r.value) });
    busy(bA, false);
    if (error) return toast(errMsg(error));
    toast('Opción aceptada.'); viewDetalle(c.id, true);
  };
  const bD = $('#bDes');
  if (bD) bD.onclick = async ()=>{
    if (!await confirmar('¿El cliente desiste de la consulta N° '+nro(c.id)+'? Esta acción no se puede deshacer.', 'Sí, desiste')) return;
    busy(bD, true);
    const { error } = await sb.rpc('agencia_desistir', { p_consulta:c.id });
    busy(bD, false);
    if (error) return toast(errMsg(error));
    toast('Consulta marcada como desistida.'); viewDetalle(c.id, true);
  };
}

// ===================== MI AGENCIA =====================
function viewAgencia(){
  const a = S.agencia;
  const kv = (k,v)=>'<div class="kv"><span>'+k+'</span><span>'+esc(v||'—')+'</span></div>';
  const html = '<h1>Mi agencia</h1><section class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px">'
    + kv('Razón social', a.razon_social) + kv('CUIT', fmtCuit(a.cuit)) + kv('Responsable', a.responsable)
    + kv('Teléfono', a.telefono) + kv('Email', a.email) + kv('Localidad', a.localidad) + kv('Provincia', a.provincia)
    + kv('Habilitada desde', a.aprobado_at ? fmtFecha(a.aprobado_at) : '') + '</section>'
    + '<p class="muted" style="margin:0;font-size:14px">Para modificar estos datos, escribinos por WhatsApp. <button class="btn-link" id="bWa2">Consulta por WhatsApp</button></p>'
    + '<p class="muted" style="margin:0;font-size:12px">Portal Agencias v'+APP_VER+'</p>';
  app.innerHTML = shell('#agencia', html); bindShell();
  $('#bWa2').onclick = abrirWhatsApp;
}
